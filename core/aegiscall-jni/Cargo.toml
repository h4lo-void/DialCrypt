[package]
name = "aegiscall-jni"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "JNI bridge between the DialCrypt Android app and the Rust core: handle registry, pull-based events"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegiscall-memsec = { path = "../aegiscall-memsec" }
aegiscall-modem = { path = "../aegiscall-modem" }
aegiscall-crypto = { path = "../aegiscall-crypto" }
aegiscall-chat = { path = "../aegiscall-chat" }
aegiscall-trust = { path = "../aegiscall-trust" }
jni.workspace = true
blake3.workspace = true
rand_core.workspace = true
zeroize.workspace = true

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc.workspace = true

[dev-dependencies]
p256.workspace = true
sha2 = { workspace = true, features = ["oid"] }
hmac = "0.12.1"
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "builder", "hazmat"] }
