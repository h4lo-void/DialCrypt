[package]
name = "aegiscall-trust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
description = "PIN-protected vault and Android key attestation verification for DialCrypt"

[dependencies]
aegiscall-memsec = { path = "../aegiscall-memsec" }
zeroize.workspace = true
subtle.workspace = true
rand_core.workspace = true
sha2 = { workspace = true, features = ["oid"] }
chacha20poly1305.workspace = true
p256.workspace = true
hmac = "0.12.1"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
p384 = { version = "0.13.1", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit", "sha2"] }
sha1 = "0.10"
x509-cert = { version = "0.2.5", default-features = false }

[dev-dependencies]
hkdf.workspace = true
p384 = { version = "0.13.1", default-features = false, features = ["ecdsa", "pkcs8"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "builder", "hazmat"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit", "sha2"] }
