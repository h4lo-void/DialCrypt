[package]
name = "aegiscall-crypto-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand_core = "0.6.4"
aegiscall-crypto = { path = "..", features = ["test-signer"] }
aegiscall-memsec = { path = "../../aegiscall-memsec" }

# Independent of the root workspace (cargo-fuzz needs nightly; the workspace builds on stable).
[workspace]

[[bin]]
name = "hs_on_message"
path = "fuzz_targets/hs_on_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_parse"
path = "fuzz_targets/pairing_parse.rs"
test = false
doc = false
bench = false
