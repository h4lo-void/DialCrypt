[workspace]
resolver = "2"
members = [
    "core/aegiscall-memsec",
    "core/aegiscall-modem",
    "core/aegiscall-crypto",
    "core/aegiscall-trust",
    "core/aegiscall-mux",
    "core/aegiscall-chat",
    "core/aegiscall-jni",
    "daemon",
    "tools/modem-wav",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
repository = "https://github.com/h4lo-void/DialCrypt"
authors = ["DialCrypt Clean-Room Contributors"]

[workspace.dependencies]
zeroize = { version = "1.8", features = ["derive"] }
chacha20poly1305 = "0.10.1"
chacha20 = { version = "0.9.1", features = ["zeroize"] }
poly1305 = { version = "0.8.0", features = ["zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8"] }
ml-kem = { version = "0.2.3", features = ["zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
blake3 = { version = "1.8", features = ["pure", "zeroize"] }
crc = "3.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
getrandom = "0.2"
subtle = "2.6"
libc = "0.2"
jni = "0.21.1"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
