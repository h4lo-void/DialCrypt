    <path d="M1033 192 L1042 198 L1033 204"/>
    <path d="M247 192 L238 198 L247 204"/>
  </g>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M238 198 H1042" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.0001;0.0938;0.1250;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0001;0.0938;0.1250;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M1042 198 H238" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.0001;0.0938;0.1250;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0001;0.0938;0.1250;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="256" y="189" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F4EFE4">Preamble</text>
  <rect x="341.6" y="175" width="60.400000000000006" height="19" rx="9.5" fill="#D9C8A5" fill-opacity="0.12" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1"/>
  <text x="349.6" y="188.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#D9C8A5">400 ms</text>
  <text x="256" y="216" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.6" fill="#9A9486">Rising and falling chirp, 600 to 1900 Hz, plus a capability header. No peer preamble in 20 s: hang up.</text>
  <rect x="226" y="222" width="828" height="50" rx="8" fill="#D9C8A5" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.1210;0.1250;0.2188;0.2500;1" dur="18s" repeatCount="indefinite"/></rect>
  <g stroke="#D9C8A5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><animate attributeName="opacity" values="0.55;0.55;1;1;0.55;0.55" keyTimes="0;0.1210;0.1250;0.2188;0.2500;1" dur="18s" repeatCount="indefinite"/>
    <line x1="238" y1="252" x2="1042" y2="252"/>
    <path d="M1033 246 L1042 252 L1033 258"/>
    <path d="M247 246 L238 252 L247 258"/>
  </g>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M238 252 H1042" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.1250;0.2188;0.2500;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.1250;0.2188;0.2500;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M1042 252 H238" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.1250;0.2188;0.2500;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.1250;0.2188;0.2500;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="256" y="243" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F4EFE4">HS1</text>
  <rect x="295.6" y="229" width="112.2" height="19" rx="9.5" fill="#D9C8A5" fill-opacity="0.12" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1"/>
  <text x="303.6" y="242.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#D9C8A5">77 B each way</text>
  <text x="256" y="270" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.6" fill="#9A9486">Commitments to the key shares come first. The answerer fills its contact tags with random bytes.</text>
  <rect x="226" y="276" width="828" height="50" rx="8" fill="#D9C8A5" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.2460;0.2500;0.3438;0.3750;1" dur="18s" repeatCount="indefinite"/></rect>
  <g stroke="#D9C8A5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><animate attributeName="opacity" values="0.55;0.55;1;1;0.55;0.55" keyTimes="0;0.2460;0.2500;0.3438;0.3750;1" dur="18s" repeatCount="indefinite"/>
    <line x1="238" y1="306" x2="1042" y2="306"/>
    <path d="M247 300 L238 306 L247 312"/>
  </g>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M1042 306 H238" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.2500;0.3438;0.3750;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.2500;0.3438;0.3750;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="256" y="297" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F4EFE4">PATH</text>
  <rect x="304.8" y="283" width="38.2" height="19" rx="9.5" fill="#D9C8A5" fill-opacity="0.12" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1"/>
  <text x="312.8" y="296.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#D9C8A5">2 B</text>
  <text x="256" y="324" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.6" fill="#9A9486">The answerer matched the dialer's tags against its vault. The verdict is hashed into the transcript.</text>
  <rect x="226" y="330" width="828" height="50" rx="8" fill="#D9C8A5" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.3710;0.3750;0.4688;0.5000;1" dur="18s" repeatCount="indefinite"/></rect>
  <g stroke="#D9C8A5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><animate attributeName="opacity" values="0.55;0.55;1;1;0.55;0.55" keyTimes="0;0.3710;0.3750;0.4688;0.5000;1" dur="18s" repeatCount="indefinite"/>
    <line x1="238" y1="360" x2="1042" y2="360"/>
    <path d="M247 354 L238 360 L247 366"/>
  </g>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M1042 360 H238" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.3750;0.4688;0.5000;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.3750;0.4688;0.5000;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="256" y="351" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F4EFE4">HS2</text>
  <rect x="295.6" y="337" width="67.80000000000001" height="19" rx="9.5" fill="#D9C8A5" fill-opacity="0.12" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1"/>
  <text x="303.6" y="350.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#D9C8A5">1,600 B</text>
  <text x="256" y="378" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.6" fill="#9A9486">X25519 share and ML-KEM-1024 encapsulation key.</text>
  <rect x="226" y="384" width="828" height="50" rx="8" fill="#D9C8A5" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.4960;0.5000;0.5938;0.6250;1" dur="18s" repeatCount="indefinite"/></rect>
  <g stroke="#D9C8A5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><animate attributeName="opacity" values="0.55;0.55;1;1;0.55;0.55" keyTimes="0;0.4960;0.5000;0.5938;0.6250;1" dur="18s" repeatCount="indefinite"/>
    <line x1="238" y1="414" x2="1042" y2="414"/>
    <path d="M1033 408 L1042 414 L1033 420"/>
  </g>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M238 414 H1042" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.5000;0.5938;0.6250;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.5000;0.5938;0.6250;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="256" y="405" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F4EFE4">HS3</text>
  <rect x="295.6" y="391" width="67.80000000000001" height="19" rx="9.5" fill="#D9C8A5" fill-opacity="0.12" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1"/>
  <text x="303.6" y="404.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#D9C8A5">1,729 B</text>
  <text x="256" y="432" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.6" fill="#9A9486">X25519 share, ML-KEM-1024 ciphertext, and the dialer's identity: signed in StrongBox, then sealed.</text>
  <rect x="226" y="438" width="828" height="50" rx="8" fill="#D9C8A5" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.6210;0.6250;0.7188;0.7500;1" dur="18s" repeatCount="indefinite"/></rect>
  <g stroke="#D9C8A5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><animate attributeName="opacity" values="0.55;0.55;1;1;0.55;0.55" keyTimes="0;0.6210;0.6250;0.7188;0.7500;1" dur="18s" repeatCount="indefinite"/>
    <line x1="238" y1="468" x2="1042" y2="468"/>
    <path d="M247 462 L238 468 L247 474"/>
  </g>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M1042 468 H238" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.6250;0.7188;0.7500;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.6250;0.7188;0.7500;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="256" y="459" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F4EFE4">HS4</text>
  <rect x="295.6" y="445" width="53" height="19" rx="9.5" fill="#D9C8A5" fill-opacity="0.12" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1"/>
  <text x="303.6" y="458.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#D9C8A5">129 B</text>
  <text x="256" y="486" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.6" fill="#9A9486">The answerer's identity: signed in StrongBox, then sealed. Attestation chains are verified.</text>
  <rect x="226" y="492" width="828" height="50" rx="8" fill="#7FD1AE" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.7460;0.7500;0.8438;0.8750;1" dur="18s" repeatCount="indefinite"/></rect>
  <g stroke="#7FD1AE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><animate attributeName="opacity" values="0.55;0.55;1;1;0.55;0.55" keyTimes="0;0.7460;0.7500;0.8438;0.8750;1" dur="18s" repeatCount="indefinite"/>
    <line x1="238" y1="522" x2="1042" y2="522"/>
    <path d="M1033 516 L1042 522 L1033 528"/>
    <path d="M247 516 L238 522 L247 528"/>
  </g>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M238 522 H1042" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.7500;0.8438;0.8750;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.7500;0.8438;0.8750;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M1042 522 H238" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.7500;0.8438;0.8750;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.7500;0.8438;0.8750;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="256" y="513" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7FD1AE">Five words</text>
  <rect x="360" y="499" width="67.80000000000001" height="19" rx="9.5" fill="#7FD1AE" fill-opacity="0.12" stroke="#7FD1AE" stroke-opacity="0.5" stroke-width="1"/>
  <text x="368" y="512.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7FD1AE">40 bits</text>
  <text x="256" y="540" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.6" fill="#9A9486">Both people read five words aloud in a timed voice window. A mismatch means: do not trust this call.</text>
  <rect x="226" y="546" width="828" height="50" rx="8" fill="#7FD1AE" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.8710;0.8750;0.9688;0.9999;1" dur="18s" repeatCount="indefinite"/></rect>
  <g stroke="#7FD1AE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><animate attributeName="opacity" values="0.55;0.55;1;1;0.55;0.55" keyTimes="0;0.8710;0.8750;0.9688;0.9999;1" dur="18s" repeatCount="indefinite"/>
    <line x1="238" y1="576" x2="1042" y2="576"/>
    <path d="M1033 570 L1042 576 L1033 582"/>
    <path d="M247 570 L238 576 L247 582"/>
  </g>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M238 576 H1042" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.8750;0.9688;0.9999;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.8750;0.9688;0.9999;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle r="9" fill="url(#dot)" opacity="0"><animateMotion path="M1042 576 H238" dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;1" keyTimes="0.0000;0.8750;0.9688;0.9999;1.0000"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.8750;0.9688;0.9999;1.0000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="256" y="567" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7FD1AE">Encrypted chat</text>
  <rect x="396.79999999999995" y="553" width="97.4" height="19" rx="9.5" fill="#7FD1AE" fill-opacity="0.12" stroke="#7FD1AE" stroke-opacity="0.5" stroke-width="1"/>
  <text x="404.79999999999995" y="566.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7FD1AE">23 B frames</text>
  <text x="256" y="594" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.6" fill="#9A9486">XChaCha20 with a Poly1305 tag. A fresh X25519 ratchet step every 375 frames.</text>
  <rect x="84" y="401" width="132" height="26" rx="6" fill="#D9C8A5" fill-opacity="0.1" stroke="#D9C8A5" stroke-opacity="0.6" stroke-width="1"/>
  <text x="150" y="418.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#D9C8A5">Titan M2 signs</text>
  <rect x="1064" y="455" width="132" height="26" rx="6" fill="#D9C8A5" fill-opacity="0.1" stroke="#D9C8A5" stroke-opacity="0.6" stroke-width="1"/>
  <text x="1130" y="472.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#D9C8A5">Titan M2 signs</text>
  <line x1="40" y1="614" x2="1240" y2="614" stroke="#D9C8A5" stroke-opacity="0.16" stroke-width="1"/>
  <text x="40" y="638" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#7FD1AE">QUICK CONNECT</text>
  <text x="190" y="638" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">A contact you have verified skips to HS1, PATH, RS2 (32 B) and RS3 (80 B). ML-KEM-1024 is then added in the background,</text>
  <text x="190" y="657" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">and the screen claims post-quantum protection only after that exchange has been ratcheted in.</text>
</svg>
