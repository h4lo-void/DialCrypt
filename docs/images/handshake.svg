<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="684" viewBox="0 0 1280 684" role="img" aria-labelledby="ht hd">
  <title id="ht">The handshake, as sound</title>
  <desc id="hd">Sequence of the full handshake between the dialing and the answering phone: chirp preamble, two 77-byte HS1 commitments, a 2-byte PATH verdict, HS2 with an X25519 share and an ML-KEM-1024 encapsulation key, HS3 with the ciphertext and a sealed identity signed in StrongBox, HS4 with the answerer's sealed identity, five words read aloud, then encrypted chat with a DH ratchet.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16181B"/><stop offset="1" stop-color="#0D0F11"/></linearGradient>
  <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F4EFE4"/><stop offset="0.4" stop-color="#D9C8A5"/><stop offset="1" stop-color="#D9C8A5" stop-opacity="0"/></radialGradient></defs>
  <rect width="1280" height="684" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="682" rx="14" fill="none" stroke="#D9C8A5" stroke-opacity="0.28" stroke-width="2"/>
  <text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#F4EFE4">The handshake, as sound</text>
  <text x="40" y="80" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9A9486">Every byte below crosses the voice call as modem tones. The caller ID decides nothing; any failed check ends the call.</text>
  <rect x="138" y="102" width="184" height="44" rx="10" fill="#15171A" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="230" y="121" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle" fill="#F4EFE4">Pixel A</text>
  <text x="230" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#9A9486">dials</text>
  <line x1="230" y1="146" x2="230" y2="594" stroke="#D9C8A5" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 6"/>
  <rect x="958" y="102" width="184" height="44" rx="10" fill="#15171A" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1050" y="121" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle" fill="#F4EFE4">Pixel B</text>
  <text x="1050" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#9A9486">answers</text>
  <line x1="1050" y1="146" x2="1050" y2="594" stroke="#D9C8A5" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 6"/>
  <rect x="226" y="168" width="828" height="50" rx="8" fill="#D9C8A5" fill-opacity="0"><animate attributeName="fill-opacity" values="0.09;0.09;0;0" keyTimes="0;0.0938;0.1250;1" dur="18s" repeatCount="indefinite"/></rect>
  <g stroke="#D9C8A5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><animate attributeName="opacity" values="1;1;0.55;0.55" keyTimes="0;0.0938;0.1250;1" dur="18s" repeatCount="indefinite"/>
