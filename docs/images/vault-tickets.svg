  <rect x="546" y="160" width="104" height="136" rx="10" fill="#E0796B" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0.0000;0.7875;0.8063;0.8250;1.0000" dur="16s" repeatCount="indefinite"/></rect>
  <rect x="546" y="160" width="104" height="136" rx="10" fill="#7FD1AE" opacity="0"><animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0.0000;0.6000;0.6188;0.6563;1.0000" dur="16s" repeatCount="indefinite"/></rect>
  <g opacity="1"><animate attributeName="opacity" values="1;0;1;1" keyTimes="0.0000;0.1875;0.9750;1.0000" dur="16s" repeatCount="indefinite" calcMode="discrete"/>
    <rect x="40" y="346" width="98.8" height="32" rx="16" fill="#D9C8A5" fill-opacity="0.14" stroke="#D9C8A5" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="89.4" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#D9C8A5">At rest</text>
    <text x="154.8" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.2" fill="#F4EFE4">Five keys, five tries. The vault file is useless without one of them.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.1875;0.3750;1.0000" dur="16s" repeatCount="indefinite" calcMode="discrete"/>
    <rect x="40" y="346" width="119.60000000000001" height="32" rx="16" fill="#E0796B" fill-opacity="0.14" stroke="#E0796B" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="99.80000000000001" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#E0796B">Wrong PIN</text>
    <text x="175.60000000000002" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.2" fill="#F4EFE4">The key it used is gone for good. Four tries left.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.3750;0.6000;1.0000" dur="16s" repeatCount="indefinite" calcMode="discrete"/>
    <rect x="40" y="346" width="140.4" height="32" rx="16" fill="#E0796B" fill-opacity="0.14" stroke="#E0796B" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="110.2" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#E0796B">Wrong again</text>
    <text x="196.4" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.2" fill="#F4EFE4">Three left. Restoring an old copy of the vault restores no key.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.6000;0.7875;1.0000" dur="16s" repeatCount="indefinite" calcMode="discrete"/>
    <rect x="40" y="346" width="140.4" height="32" rx="16" fill="#7FD1AE" fill-opacity="0.14" stroke="#7FD1AE" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="110.2" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#7FD1AE">Correct PIN</text>
    <text x="196.4" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.2" fill="#F4EFE4">The vault is re-sealed under five fresh keys and the old ones are deleted.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.7875;0.9625;1.0000" dur="16s" repeatCount="indefinite" calcMode="discrete"/>
    <rect x="40" y="346" width="130" height="32" rx="16" fill="#E0796B" fill-opacity="0.14" stroke="#E0796B" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="105" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#E0796B">Duress PIN</text>
    <text x="186" y="368" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.2" fill="#F4EFE4">Every key and the vault are destroyed. The app closes.</text>
  </g>
  <rect x="40" y="394" width="640" height="3" rx="1.5" fill="#D9C8A5" fill-opacity="0.12"/>
  <rect x="40" y="394" width="0" height="3" rx="1.5" fill="#D9C8A5" fill-opacity="0.7"><animate attributeName="width" values="0;640" dur="16s" repeatCount="indefinite"/></rect>
  <rect x="724" y="111" width="9" height="9" rx="2" fill="#D9C8A5"/>
  <text x="746" y="120" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F4EFE4">Stretched before it is asked</text>
  <text x="746" y="141" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">Argon2id with 64 MiB and 3 passes turns the PIN</text>
  <text x="746" y="159" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">into the value a ticket has to sign.</text>
  <rect x="724" y="191" width="9" height="9" rx="2" fill="#D9C8A5"/>
  <text x="746" y="200" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F4EFE4">The duress slot looks like the real one</text>
  <text x="746" y="221" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">Normal and duress wraps have the same length</text>
  <text x="746" y="239" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">and format and are stored sorted by bytes.</text>
  <rect x="724" y="271" width="9" height="9" rx="2" fill="#D9C8A5"/>
  <text x="746" y="280" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F4EFE4">Nothing to measure from outside</text>
  <text x="746" y="301" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">The vault file is padded to 4 KiB blocks, so its</text>
  <text x="746" y="319" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">size does not follow the number of contacts.</text>
  <rect x="724" y="351" width="9" height="9" rx="2" fill="#D9C8A5"/>
  <text x="746" y="360" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F4EFE4">A fingerprint cannot refill it</text>
  <text x="746" y="381" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">The optional fingerprint answer puts back only the</text>
  <text x="746" y="399" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9A9486">ticket it spent. Spent PIN tries stay spent.</text>
</svg>
