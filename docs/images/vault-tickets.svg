  <text x="62" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#D9C8A5">TITAN M2 STRONGBOX</text>
  <text x="658" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end" fill="#9A9486">HMAC-SHA256, setMaxUsageCount(1)</text>
