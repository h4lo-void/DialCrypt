<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="432" viewBox="0 0 1280 432" role="img" aria-labelledby="vt vd">
  <title id="vt">A PIN limit that lives in hardware</title>
  <desc id="vd">The vault is sealed under five single-use keys held in the Titan M2 StrongBox. A wrong PIN uses up one key for good. A correct PIN re-seals the vault under five fresh keys and deletes the old ones. The duress PIN destroys every key and the vault.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16181B"/><stop offset="1" stop-color="#0D0F11"/></linearGradient></defs>
  <rect width="1280" height="432" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="430" rx="14" fill="none" stroke="#D9C8A5" stroke-opacity="0.28" stroke-width="2"/>
  <text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#F4EFE4">A PIN limit that lives in hardware</text>
  <text x="40" y="80" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9A9486">Android gives apps no counter that survives a restored backup. DialCrypt counts with keys that can each be used exactly once.</text>
  <rect x="40" y="108" width="640" height="214" rx="14" fill="#15171A" stroke="#D9C8A5" stroke-opacity="0.5" stroke-width="1.5"/>
