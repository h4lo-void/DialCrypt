<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="spt spd">
  <title id="spt">DialCrypt — Post-Quantum Data over Voice</title>
  <desc id="spd">GitHub social preview for DialCrypt: end-to-end encrypted messaging over cellular voice calls (VoLTE/VoNR) with a Rust voice-band modem, hybrid X25519 + ML-KEM-1024 key exchange, Titan M2 StrongBox, and zero INTERNET permission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181B"/>
      <stop offset="0.55" stop-color="#101214"/>
      <stop offset="1" stop-color="#0B0D0F"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9C8A5" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#D9C8A5" stop-opacity="0.75"/>
      <stop offset="0.8" stop-color="#D9C8A5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#D9C8A5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lockGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9C8A5" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#D9C8A5" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#D9C8A5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FD1AE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7FD1AE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- Subtle technical grid lines on right half -->
  <g stroke="#D9C8A5" stroke-opacity="0.05" stroke-width="1">
    <line x1="760" y1="72" x2="760" y2="520"/>
    <line x1="860" y1="72" x2="860" y2="520"/>
    <line x1="960" y1="72" x2="960" y2="520"/>
    <line x1="1060" y1="72" x2="1060" y2="520"/>
    <line x1="1160" y1="72" x2="1160" y2="520"/>
    <line x1="740" y1="160" x2="1200" y2="160"/>
    <line x1="740" y1="260" x2="1200" y2="260"/>
    <line x1="740" y1="360" x2="1200" y2="360"/>
    <line x1="740" y1="460" x2="1200" y2="460"/>
  </g>
  <!-- Ambient glows -->
  <circle cx="1115" cy="296" r="150" fill="url(#lockGlow)"/>
  <circle cx="845" cy="296" r="130" fill="url(#accentGlow)"/>

  <!-- Inner border inside safe margin -->
  <rect x="28" y="28" width="1224" height="584" rx="18" fill="none" stroke="#D9C8A5" stroke-opacity="0.24" stroke-width="1.5"/>

  <!-- Left column: identity and positioning -->
  <!-- Accent bar + eyebrow -->
  <rect x="76" y="84" width="52" height="4" rx="2" fill="#7FD1AE"/>
  <text x="142" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="2.2" fill="#7FD1AE">POST-QUANTUM DATA OVER VOICE</text>

  <!-- Main Title -->
  <text x="72" y="196" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-1" fill="#F4EFE4">DialCrypt</text>

  <!-- Core 3-second explanation -->
  <text x="76" y="256" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#D9C8A5">Encrypted messaging over cellular voice calls.</text>
  <text x="76" y="294" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9A9486">No Internet permission. No server. Ordinary VoLTE / VoNR calls.</text>

  <!-- Four technical spec pills (2x2 clean grid) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500">
    <!-- Row 1 -->
    <rect x="76" y="344" width="292" height="44" rx="22" fill="#D9C8A5" fill-opacity="0.08" stroke="#D9C8A5" stroke-opacity="0.45" stroke-width="1.3"/>
    <circle cx="101" cy="366" r="4.5" fill="#7FD1AE"/>
    <text x="118" y="371" fill="#F4EFE4">Rust Voice-Band Modem</text>

    <rect x="384" y="344" width="292" height="44" rx="22" fill="#D9C8A5" fill-opacity="0.08" stroke="#D9C8A5" stroke-opacity="0.45" stroke-width="1.3"/>
    <circle cx="409" cy="366" r="4.5" fill="#D9C8A5"/>
    <text x="426" y="371" fill="#F4EFE4">X25519 + ML-KEM-1024</text>

    <!-- Row 2 -->
    <rect x="76" y="404" width="292" height="44" rx="22" fill="#D9C8A5" fill-opacity="0.08" stroke="#D9C8A5" stroke-opacity="0.45" stroke-width="1.3"/>
    <circle cx="101" cy="426" r="4.5" fill="#D9C8A5"/>
    <text x="118" y="431" fill="#F4EFE4">Titan M2 StrongBox</text>

    <rect x="384" y="404" width="292" height="44" rx="22" fill="#7FD1AE" fill-opacity="0.09" stroke="#7FD1AE" stroke-opacity="0.48" stroke-width="1.3"/>
    <circle cx="409" cy="426" r="4.5" fill="#7FD1AE"/>
    <text x="426" y="431" fill="#F4EFE4">No INTERNET Permission</text>
  </g>

  <!-- Right visual: Voice-band spectrum bars -> quantized bit matrix -> padlock -->
  <!-- Passband bracket above bars -->
  <path d="M766 196 V186 H954 V196" fill="none" stroke="#7FD1AE" stroke-opacity="0.65" stroke-width="1.4"/>
  <text x="860" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7FD1AE">AMR-WB / EVS VOICE BAND</text>

  <!-- Audio spectrum / voice-band bars -->
  <g>
    <rect x="768" y="254" width="7" height="84" rx="3.5" fill="#7FD1AE" opacity="0.92"/>
    <rect x="781" y="232" width="7" height="128" rx="3.5" fill="#7FD1AE" opacity="0.90"/>
    <rect x="794" y="216" width="7" height="160" rx="3.5" fill="#7FD1AE" opacity="0.88"/>
    <rect x="807" y="242" width="7" height="108" rx="3.5" fill="#D9C8A5" opacity="0.92"/>
    <rect x="820" y="272" width="7" height="48" rx="3.5" fill="#D9C8A5" opacity="0.86"/>
    <rect x="833" y="226" width="7" height="140" rx="3.5" fill="#D9C8A5" opacity="0.94"/>
    <rect x="846" y="264" width="7" height="64" rx="3.5" fill="#D9C8A5" opacity="0.82"/>
    <rect x="859" y="218" width="7" height="156" rx="3.5" fill="#D9C8A5" opacity="0.95"/>
    <rect x="872" y="248" width="7" height="96" rx="3.5" fill="#D9C8A5" opacity="0.85"/>
    <rect x="885" y="230" width="7" height="132" rx="3.5" fill="#D9C8A5" opacity="0.88"/>
    <rect x="898" y="256" width="7" height="80" rx="3.5" fill="#D9C8A5" opacity="0.80"/>
    <rect x="911" y="238" width="7" height="116" rx="3.5" fill="#D9C8A5" opacity="0.78"/>
    <rect x="924" y="266" width="7" height="60" rx="3.5" fill="#D9C8A5" opacity="0.72"/>
    <rect x="937" y="244" width="7" height="104" rx="3.5" fill="#D9C8A5" opacity="0.68"/>
  </g>
  <text x="856" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9A9486">500 Hz  ───────  6.4 kHz</text>

  <!-- Bit matrix bridging sound to lock -->
  <g stroke="#D9C8A5" stroke-opacity="0.75" stroke-width="1.2">
    <!-- Col 1 -->
    <rect x="964" y="264" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.95"/>
    <rect x="964" y="282" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.16"/>
    <rect x="964" y="300" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.90"/>
    <rect x="964" y="318" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.16"/>
    <!-- Col 2 -->
    <rect x="980" y="264" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.16"/>
    <rect x="980" y="282" width="10" height="10" rx="2" fill="#7FD1AE" fill-opacity="0.95"/>
    <rect x="980" y="300" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.16"/>
    <rect x="980" y="318" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.92"/>
    <!-- Col 3 -->
    <rect x="996" y="264" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.95"/>
    <rect x="996" y="282" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.90"/>
    <rect x="996" y="300" width="10" height="10" rx="2" fill="#7FD1AE" fill-opacity="0.90"/>
    <rect x="996" y="318" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.16"/>
    <!-- Col 4 -->
    <rect x="1012" y="264" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.16"/>
    <rect x="1012" y="282" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.95"/>
    <rect x="1012" y="300" width="10" height="10" rx="2" fill="#D9C8A5" fill-opacity="0.95"/>
    <rect x="1012" y="318" width="10" height="10" rx="2" fill="#7FD1AE" fill-opacity="0.92"/>
  </g>

  <!-- Dotted link into lock -->
  <line x1="1032" y1="296" x2="1056" y2="296" stroke="#D9C8A5" stroke-opacity="0.65" stroke-width="2.2" stroke-dasharray="3 6" stroke-linecap="round"/>

  <!-- Lock concentric rings -->
  <circle cx="1115" cy="296" r="88" fill="none" stroke="#D9C8A5" stroke-opacity="0.16" stroke-width="1.2"/>
  <circle cx="1115" cy="296" r="68" fill="none" stroke="#D9C8A5" stroke-opacity="0.30" stroke-width="1.4" stroke-dasharray="4 5"/>

  <!-- Padlock icon -->
  <g>
    <path d="M1087 282 V260 a28 28 0 0 1 56 0 V282" fill="none" stroke="#D9C8A5" stroke-width="11" stroke-linecap="round"/>
    <rect x="1068" y="278" width="94" height="78" rx="14" fill="#D9C8A5"/>
    <circle cx="1115" cy="310" r="9" fill="#101214"/>
    <rect x="1111.5" y="313" width="7" height="22" rx="3.5" fill="#101214"/>
  </g>

  <!-- Horizontal divider & footer bar -->
  <rect x="76" y="504" width="1128" height="1.5" fill="url(#rule)"/>
  <text x="76" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#D9C8A5">github.com/h4lo-void/DialCrypt</text>
  <text x="1204" y="548" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9A9486">Rooted Android Pixel · GPL-3.0 · Pre-Alpha Research Prototype</text>
</svg>
