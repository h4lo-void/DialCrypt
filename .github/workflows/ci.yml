name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust Workspace & Supply-Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace unit & acceptance tests
        run: cargo test --workspace --locked
      - name: Run crypto test-signer tests
        run: cargo test -p aegiscall-crypto --features test-signer --locked
      - name: Check dependencies with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked

  android:
    name: Android Unit & Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the legacy "tools" package, which the SDK repository no longer serves.
          packages: platform-tools
      - name: Run PixelTitan debug unit tests
        run: ./gradlew --console=plain :app:testPixelTitanDebugUnitTest
