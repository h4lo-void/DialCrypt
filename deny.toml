# cargo-deny configuration: restricts third-party dependencies to permissive
# licenses and rejects unknown registries and git sources.

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
exceptions = []
# The workspace's own crates are GPL-3.0-only and never published; the allow-list is for third parties.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace's own unpublished crates carry no version.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Explicitly ban copyleft/patented codec crates from entering dependency graph
    { name = "codec2" },
    { name = "ffmpeg-next" },
    { name = "gstreamer" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
